[project]
name = "rayda-fleet-intelligence"
version = "0.1.0"
description = "Multi-tenant fleet intelligence scaffold"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.121.3",
  "httpx==0.28.1",
  "langgraph==1.0.3",
  "psycopg[binary]==3.2.13",
  "pydantic-settings==2.12.0",
  "sqlalchemy==2.1.9",
  "alembic==1.20.1",
  "uvicorn[standard]==0.38.0",
]

[project.optional-dependencies]
observability = [
  "opentelemetry-api==1.44.0",
  "opentelemetry-sdk==1.44.0",
  "opentelemetry-exporter-otlp-proto-http==1.44.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==9.0.1",
  "ruff==0.14.5",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/src/fleet"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
pythonpath = ["apps/api/src"]
addopts = "-ra"
markers = ["integration: requires a PostgreSQL test database"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/api/src", "apps/api/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
